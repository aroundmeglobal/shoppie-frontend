name: Slack Notification on Push

on:
  push:
    branches:
      - prayag  # This will trigger on pushes to the prayag branch
      - development

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history to get proper commit info
      
      - name: Get commit details
        id: commit-details
        run: |
          COMMITTER=$(git show -s --format='%an' ${{ github.sha }})
          COMMIT_MSG=$(git show -s --format='%s' ${{ github.sha }})
          echo "committer=$COMMITTER" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
      
      - name: Determine branch and webhook
        id: branch-info
        run: |
          # Use the new webhook URL for all branches
          if [[ "${{ github.ref }}" == "refs/heads/prayag" ]]; then
            echo "branch_name=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
            echo "branch_name=development" >> $GITHUB_OUTPUT
          fi
          echo "webhook_url=${{ secrets.SLACK_WEBHOOK }}" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: steps.branch-info.outputs.webhook_url != ''
        run: |
          PAYLOAD="{\"text\":\"*:rocket: Pushed!* A new push to the ${{ steps.branch-info.outputs.branch_name }} branch [SHOPPIE FRONTEND] was successful!\n*Committer:* ${{ steps.commit-details.outputs.committer }}\n*Commit Message:* ${{ steps.commit-details.outputs.message }}\n*Commit Hash:* ${{ github.sha }}\"}"
          
          curl -X POST -H 'Content-type: application/json' --data "${PAYLOAD}" ${{ steps.branch-info.outputs.webhook_url }}
